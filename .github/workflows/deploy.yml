# .github/workflows/deploy.yml
#
# Secrets necessários (configurar antes do primeiro push):
#   Repositório → Settings → Secrets and variables → Actions → New repository secret
#
#   CLOUDFLARE_API_TOKEN   → painel Cloudflare → My Profile → API Tokens
#                            (permissão mínima: Workers Scripts:Edit + D1:Edit)
#   CLOUDFLARE_ACCOUNT_ID  → painel Cloudflare → lado direito da home da conta

name: Deploy — migrate + publish

on:
  push:
    branches:
      - main          # dispara apenas em push direto na main
                      # pull_requests não ativam este workflow

jobs:
  # ─── JOB 1: aplicar migrations no D1 remoto ──────────────────────────────
  migrate:
    name: D1 Migrations
    runs-on: ubuntu-latest

    env:
      CLOUDFLARE_API_TOKEN:  ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Instalar dependências do projeto
        run: npm ci

      - name: Aplicar migrations no D1 (remoto)
        run: npx wrangler d1 migrations apply afiliados --remote

  # ─── JOB 2: publicar o Worker ─────────────────────────────────────────────
  deploy:
    name: Wrangler Deploy
    runs-on: ubuntu-latest
    needs: [migrate]      # só executa se migrate concluir com sucesso

    env:
      CLOUDFLARE_API_TOKEN:  ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Instalar dependências do projeto
        run: npm ci

      - name: Publicar Worker na Cloudflare
        run: npx wrangler deploy
